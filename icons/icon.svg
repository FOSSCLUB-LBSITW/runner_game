<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f2438"/>
      <stop offset="85%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea79"/>
      <stop offset="60%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#00ffff" stroke-opacity="0.35" stroke-width="6" />

  <!-- Grid floor lines -->
  <line x1="40" y1="390" x2="472" y2="390" stroke="#00ffff" stroke-opacity="0.4" stroke-width="4" />
  <line x1="80" y1="420" x2="432" y2="420" stroke="#ff0055" stroke-opacity="0.3" stroke-width="3" />
  <line x1="120" y1="450" x2="392" y2="450" stroke="#00ffff" stroke-opacity="0.2" stroke-width="2" />

  <!-- Speed motion trail lines -->
  <line x1="70" y1="210" x2="160" y2="210" stroke="#00ffff" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <line x1="40" y1="250" x2="140" y2="250" stroke="#ff0055" stroke-width="6" stroke-linecap="round" opacity="0.5" />
  <line x1="90" y1="290" x2="170" y2="290" stroke="#ffd700" stroke-width="6" stroke-linecap="round" opacity="0.6" />

  <!-- Runner Player (Dynamic Running/Jumping Pose) -->
  <g filter="url(#glow)">
    <!-- Head / Visor -->
    <rect x="220" y="120" width="70" height="70" rx="16" fill="url(#neonCyan)" />
    <rect x="248" y="140" width="48" height="24" rx="8" fill="#ffffff" />

    <!-- Torso -->
    <rect x="210" y="200" width="80" height="100" rx="14" fill="url(#neonCyan)" />
    <!-- Chest plate accent -->
    <rect x="228" y="220" width="44" height="50" rx="8" fill="#0369a1" />

    <!-- Forward Arm -->
    <rect x="280" y="210" width="55" height="22" rx="11" transform="rotate(30 280 210)" fill="url(#neonCyan)" />
    <!-- Back Arm -->
    <rect x="180" y="220" width="55" height="22" rx="11" transform="rotate(-40 180 220)" fill="#0284c7" />

    <!-- Front Leg (Extended Forward) -->
    <rect x="250" y="290" width="28" height="75" rx="14" transform="rotate(35 250 290)" fill="url(#neonCyan)" />
    <rect x="285" y="345" width="28" height="60" rx="14" transform="rotate(-15 285 345)" fill="url(#neonCyan)" />

    <!-- Back Leg (Trailing Backward) -->
    <rect x="210" y="290" width="28" height="70" rx="14" transform="rotate(-45 210 290)" fill="#0284c7" />
    <rect x="155" y="335" width="28" height="65" rx="14" transform="rotate(-90 155 335)" fill="#0284c7" />
  </g>

  <!-- Golden Arcade Coin -->
  <g filter="url(#glow)">
    <circle cx="380" cy="160" r="38" fill="url(#neonGold)" />
    <circle cx="380" cy="160" r="30" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="10 6" />
    <text x="380" y="174" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#78350f" text-anchor="middle">★</text>
  </g>

  <!-- Obstacle Block Ahead -->
  <rect x="390" y="310" width="65" height="80" rx="10" fill="url(#neonPink)" filter="url(#glow)" />
  <line x1="400" y1="330" x2="445" y2="330" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="400" y1="350" x2="445" y2="350" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
</svg>
